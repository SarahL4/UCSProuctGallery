# ASP.NET Core (.NET 9) build, test, and Docker image pipeline for Azure DevOps
# Docs: https://learn.microsoft.com/azure/devops/pipelines/languages/dotnet-core

trigger:
  branches:
    include:
      - main
      - master

pr:
  branches:
    include:
      - main
      - master

variables:
  # --- .NET build settings ---
  buildConfiguration: 'Release'
  dotnetSdkVersion: '9.0.x'
  webProject: 'ProductGallery/UCSProductGallery/UCSProductGallery.csproj'
  testProject: 'ProductGallery.Tests/UCSProductGallery.Tests.csproj'

  # --- Docker settings ---
  # Create a "Docker Registry" service connection in Azure DevOps
  # (Project Settings > Service connections) and put its name here.
  dockerRegistryServiceConnection: 'acr-connection'
  imageRepository: 'ucsproductgallery'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  tag: '$(Build.BuildId)'

  # --- Deploy settings ---
  # Create an "Azure Resource Manager" service connection and put its name here.
  azureServiceConnection: 'azure-arm-connection'
  # ACR login server + repository, e.g. ucsproductgallery.azurecr.io/ucsproductgallery
  containerRegistry: 'ucsproductgallery.azurecr.io'
  webAppName: 'ucsproductgallery-web'
  # Azure DevOps Environment name (Pipelines > Environments)
  deployEnvironment: 'development'

stages:
  # =========================
  # Stage 1: Build & Test (.NET)
  # =========================
  - stage: BuildAndTest
    displayName: 'Build & Test'
    jobs:
      - job: BuildTest
        displayName: 'Restore, Build, Test'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          # 1. Install the .NET 9 SDK on the build agent
          - task: UseDotNet@2
            displayName: 'Install .NET SDK'
            inputs:
              packageType: 'sdk'
              version: '$(dotnetSdkVersion)'

          # 2. Restore NuGet packages (C# dependencies)
          - task: DotNetCoreCLI@2
            displayName: 'Restore'
            inputs:
              command: 'restore'
              projects: '**/*.csproj'

          # 3. Compile the web project
          - task: DotNetCoreCLI@2
            displayName: 'Build'
            inputs:
              command: 'build'
              projects: '$(webProject)'
              arguments: '--configuration $(buildConfiguration) --no-restore'

          # 4. Run unit tests
          - task: DotNetCoreCLI@2
            displayName: 'Test'
            inputs:
              command: 'test'
              projects: '$(testProject)'
              arguments: '--configuration $(buildConfiguration) --collect:"XPlat Code Coverage"'
              publishTestResults: true

  # =========================
  # Stage 2: Docker Build & Push (only on main/master)
  # =========================
  - stage: DockerBuildAndPush
    displayName: 'Docker Build & Push'
    dependsOn: BuildAndTest
    condition: and(succeeded(), in(variables['Build.SourceBranch'], 'refs/heads/main', 'refs/heads/master'))
    jobs:
      - job: Docker
        displayName: 'Build and push image'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          # 5. Build the Docker image and push it to the container registry (ACR)
          - task: Docker@2
            displayName: 'Build and push an image to the container registry'
            inputs:
              command: 'buildAndPush'
              repository: '$(imageRepository)'
              dockerfile: '$(dockerfilePath)'
              buildContext: '$(Build.SourcesDirectory)'
              containerRegistry: '$(dockerRegistryServiceConnection)'
              tags: |
                $(tag)
                latest

  # =========================
  # Stage 3: Deploy to Azure Web App (only on main/master)
  # =========================
  - stage: Deploy
    displayName: 'Deploy to Azure Web App'
    dependsOn: DockerBuildAndPush
    condition: and(succeeded(), in(variables['Build.SourceBranch'], 'refs/heads/main', 'refs/heads/master'))
    jobs:
      - deployment: DeployWebApp
        displayName: 'Deploy container to Web App'
        pool:
          vmImage: 'ubuntu-latest'
        # Ties this deployment to the Azure DevOps Environment (deployment history / approvals)
        environment: '$(deployEnvironment)'
        strategy:
          runOnce:
            deploy:
              steps:
                # 6. Point the Web App at the freshly built image tag
                - task: AzureWebAppContainer@1
                  displayName: 'Deploy image to Azure Web App for Containers'
                  inputs:
                    azureSubscription: '$(azureServiceConnection)'
                    appName: '$(webAppName)'
                    containers: '$(containerRegistry)/$(imageRepository):$(tag)'
